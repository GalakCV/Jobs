# =============================================================================
# Configuração do crawler de vagas remotas JÚNIOR (DevOps / Security / Infra)
#
# Todos os termos abaixo são fragmentos de REGEX aplicados sobre texto
# normalizado: minúsculo e SEM acentos ("Sênior" vira "senior", "Estágio"
# vira "estagio"). Limites de palavra são adicionados automaticamente, então
# "sr" NÃO casa com "sre", e "intern" NÃO casa com "internal".
# =============================================================================

storage:
  database: data/jobs.db            # SQLite com histórico e deduplicação
  output_dir: output                # onde ficam jobs_latest.html / .json / .csv
  export_formats: [html, json, csv] # html = relatório visual com busca e filtros

logging:
  level: INFO                       # DEBUG mostra cada decisão do filtro
  file: logs/crawler.log            # rotacionado automaticamente (5 x 1 MB)

http:
  timeout_seconds: 20
  max_retries: 4                    # para 429 / 5xx / erros de rede
  backoff_base_seconds: 2.0         # 2s, 4s, 8s, 16s (+ jitter)
  min_interval_per_host_seconds: 1.5
  circuit_breaker_failures: 3       # desiste do host no resto da execução
  cache_ttl_minutes: 60             # cache em disco para não martelar as APIs
  cache_dir: .cache/http

# -----------------------------------------------------------------------------
# Fontes. Cada uma pode ser ligada/desligada. Todas, exceto LinkedIn, são APIs
# ou feeds públicos oficiais que pedem atribuição: o link salvo de cada vaga
# aponta para a fonte original.
# -----------------------------------------------------------------------------
sources:
  himalayas:
    enabled: true
    seniority: Entry-level          # filtro do próprio Himalayas
    max_pages: 3
    queries: [devops, "site reliability", "platform engineer", security,
              "soc analyst", cybersecurity, cloud, "system administrator",
              infrastructure, "it support"]

  jobicy:
    enabled: true
    industries: [admin, cybersecurity, technical-support]   # admin = DevOps & Infra
    count: 100
    max_pages: 3

  remotive:
    enabled: true
    categories: [devops]
    searches: [junior, "entry level", security]
    # O Remotive pede poucas chamadas por dia: o cache acima já ajuda.

  remoteok:
    enabled: true
    tags: [devops, sysadmin, security, infosec, cloud]

  weworkremotely:
    enabled: true
    feeds:
      - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
      - https://weworkremotely.com/remote-jobs.rss

  linkedin:
    # DESLIGADO por padrão: os Termos do LinkedIn proíbem scraping e o site
    # bloqueia IPs com frequência. Use por sua conta e risco, em baixo volume.
    enabled: false
    keywords: ["junior devops", "junior security analyst", "junior cloud engineer",
               "entry level soc analyst", "junior system administrator"]
    locations: ["United States", "Canada", "Australia"]
    max_pages: 2
    min_delay_seconds: 6

# -----------------------------------------------------------------------------
# Motor de filtragem
# -----------------------------------------------------------------------------
filters:
  # ---- Áreas (whitelist, aplicada ao TÍTULO). A primeira que casar vence. ----
  areas:
    security:
      - security
      - cyber ?security
      - cyber
      - secops
      - sec ops
      - devsecops
      - appsec
      - application security
      - soc
      - infosec
      - information security
      - iam
      - identity (?:and|&) access
      - vulnerability
      - penetration test\w*
      - pentest\w*
      - threat
      - incident response
      - detection engineer\w*
      - "seguranca(?: da informacao| cibernetica)?"   # aspas: ": " confunde o YAML
      - ciberseguranca
    devops_sre_platform:
      - devops
      - dev ops
      - sre
      - site reliability
      - platform engineer\w*
      - platform ops
      - kubernetes
      - k8s
      - ci ?/ ?cd
      - release engineer
      - build engineer
      - observability
    infra_cloud_sysadmin:
      - infrastructure
      - cloud
      - sysadmin
      - sys admin
      - systems? admin\w*
      - systems? engineer
      - linux
      - windows (?:server )?admin\w*
      - network (?:engineer|admin\w*|technician|analyst)
      - it operations
      - it ops
      - it support
      - it technician
      - desktop support
      - noc
      - data ?cent(?:er|re)
      - virtuali[sz]ation
      - infraestrutura
      - nuvem
      - administrador de (?:sistemas|redes)
      - suporte de ti
      # Descomente se quiser incluir suporte de primeiro nível:
      # - help ?desk
      # - service desk

  # Títulos que casam com uma área mas não são da área (ex.: "Cloud Sales").
  title_area_exclusions:
    - sales
    - account (?:executive|manager)
    - marketing
    - recruit\w*
    - talent acquisition
    - designer
    - product (?:manager|owner)
    - business development
    - copywriter
    - accountant
    - customer success
    - solutions? consultant

  # ---- Senioridade ----
  # Marcadores que tornam a vaga "explicitamente júnior" (procurados no TÍTULO).
  junior_markers:
    - junior
    - jr\.?
    - entry[- ]?level
    - associate
    - early[- ]career
    - new[- ]grad\w*
    - graduate
    - tier ?(?:1|i)
    - level ?(?:1|i)
    - l1
  # Também aceita "Engineer I", "Analyst I" (romano I maiúsculo) no título.
  accept_roman_one: true

  # BLACKLIST: qualquer termo destes no TÍTULO descarta a vaga imediatamente.
  seniority_blacklist:
    # estágio / trainee
    - intern
    - interns
    - internship
    - trainee
    - estagi\w*
    - apprentice\w*
    - co-?op
    # pleno / intermediário
    - pleno
    - mid
    - mid[- ]?level
    - mid[- ]?senior
    - midweight
    - intermediate
    - ii
    - iii
    - iv
    - tier ?(?:2|3|ii|iii)
    - level ?(?:2|3|ii|iii)
    - l2
    - l3
    - (?:engineer|analyst|administrator|developer|specialist) (?:2|3|4)
    # sênior e acima
    - senior
    - sr\.?
    - snr
    - lead
    - leader
    - principal
    - staff
    - manager
    - head
    - director
    - architect
    - vp
    - vice president
    - chief
    - cto
    - ciso
    - expert
    - experienced

  # Como tratar a DESCRIÇÃO:
  #   smart  (padrão) - descarta por frases que descrevem o NÍVEL da vaga
  #                     ("this is a senior role", "internship", "mid-level
  #                     position") e por anos de experiência exigidos.
  #   strict           - descarta se QUALQUER termo da blacklist aparecer em
  #                     qualquer lugar da descrição. Fiel à regra literal, mas
  #                     derruba quase tudo ("you'll report to the manager",
  #                     "work with senior engineers", "lead incident response").
  description_mode: smart

  # Descarta se a vaga exigir MAIS que isto de experiência (anos mínimos).
  # 2 => vagas pedindo 3+ anos são descartadas.
  max_years_experience: 2

  # Frases na descrição que descartam no modo smart.
  description_reject_phrases:
    - internship
    - intern (?:position|role|program\w*)
    - summer intern\w*
    - trainee program\w*
    - programa de (?:estagio|trainee)
    - vaga de estagio
    - this is an? (?:paid |unpaid )?intern\w*
    - this is an? (?:senior|mid[- ]level|lead|principal|staff)\b
    - (?:senior|mid)[- ]level (?:role|position|opportunity|engineer|candidate)
    - (?:seeking|looking for|hiring) an? (?:experienced|seasoned|senior)
    - nivel (?:pleno|senior)
    - vaga (?:pleno|senior)

  # Se true, frases como "this is a junior position" na DESCRIÇÃO também
  # contam como marcador júnior. Padrão false = só título/fonte (mais rígido).
  junior_marker_in_description: false

  # Usa o nível informado pela própria fonte (Himalayas "Entry-level",
  # Jobicy "Junior") como marcador júnior quando o título não diz nada.
  # Se a fonte disser "Mid-level"/"Senior", a vaga é descartada de qualquer jeito.
  trust_source_seniority: true

  # ---- Localização ----
  accepted_regions: [US, CA, AU, GLOBAL]
  accept_apac_as_au: true          # "APAC" inclui Austrália
  allow_unknown_location: true     # vaga sem localização informada passa (marcada)
  reject_onsite_terms: ["hybrid", "on[- ]?site", "in[- ]office", "presencial", "hibrido"]

  # Ignora vagas mais antigas que N dias (0 = sem limite).
  max_age_days: 30

# -----------------------------------------------------------------------------
# Notificações (credenciais vêm do arquivo .env)
# -----------------------------------------------------------------------------
notifications:
  discord: false
  telegram: false
  notion: false
  max_per_run: 25                  # evita spam na primeira execução
