# =============================================================================
# Crawler de vagas JÚNIOR em Segurança, DevOps e Infra.
#
# Roda DOIS perfis de busca na mesma execução e junta tudo num relatório só:
#   rio     -> vagas HÍBRIDAS no Rio de Janeiro e região metropolitana
#   remoto  -> vagas 100% REMOTAS em EUA, Canadá, Austrália e globais
#
# Uso:  python -m jobcrawler run --open
#       python -m jobcrawler run --profile rio      (só um perfil)
#
# Termos de filtro são fragmentos de REGEX aplicados sobre texto normalizado:
# minúsculo e SEM acentos ("Sênior" vira "senior"). Limites de palavra são
# automáticos: "sr" NÃO casa com "sre" e "pl" NÃO casa com "pl/sql".
# Termo com ": " (dois-pontos e espaço) precisa de aspas no YAML.
# =============================================================================

storage:
  database: data/jobs.db            # SQLite com histórico e deduplicação
  output_dir: output                # onde ficam jobs_latest.html / .json / .csv
  export_formats: [html, json, csv] # html = relatório visual com busca e filtros

logging:
  level: INFO                       # DEBUG mostra cada decisão do filtro
  file: logs/crawler.log            # rotacionado automaticamente (5 x 1 MB)

http:
  timeout_seconds: 20
  max_retries: 4                    # para 429 / 5xx / erros de rede
  backoff_base_seconds: 2.0         # 2s, 4s, 8s, 16s (+ jitter)
  min_interval_per_host_seconds: 1.5
  circuit_breaker_failures: 3       # desiste do host no resto da execução
  cache_ttl_minutes: 60             # cache em disco para não martelar as APIs
  cache_dir: .cache/http

# =============================================================================
# PERFIS: cada um diz quais fontes usa e o que muda no filtro em relação à
# seção `filters` (lá embaixo), que vale para todos.
# =============================================================================
profiles:
  rio:
    label: Híbridas no Rio
    sources: [gupy, github_issues, linkedin]
    filters:
      # ---- Modalidade ----
      workplace_types: [hybrid]         # hybrid | onsite | remote (pode combinar)
      unknown_workplace: keep           # keep = entra com aviso; reject = descarta
      workplace_from_description: true  # "modelo híbrido", "3x por semana no escritório"

      # ---- Localização ----
      location_mode: cities
      target_cities:
        # Cidade-alvo e apelidos/bairros que aparecem no lugar do nome da cidade.
        "Rio de Janeiro":
          - rio
          - barra da tijuca
          - recreio dos bandeirantes
          - centro do rio
          - botafogo
          - copacabana
          - ipanema
          - leblon
          - flamengo
          - tijuca
          - meier
          - jacarepagua
          - sao cristovao
          - ilha do fundao
          - ilha do governador
          - cidade nova
          - porto maravilha
          - campo grande
      include_metro: true               # false = só a capital
      metro_cities:
        - Niterói
        - São Gonçalo
        - Duque de Caxias
        - Nova Iguaçu
        - Belford Roxo
        - São João de Meriti
        - Nilópolis
        - Mesquita
        - Queimados
        - Itaboraí
        - Maricá
        - Itaguaí
        - Seropédica
        - Magé
      target_state:
        label: RJ
        names: [rj, rio de janeiro, estado do rio de janeiro]
      accept_state_only: true           # "[RJ]" sem cidade entra com aviso
      allow_unknown_location: false     # sem localização nenhuma: descarta

  remoto:
    label: Remotas no exterior
    sources: [himalayas, jobicy, remotive, remoteok, weworkremotely]
    filters:
      workplace_types: [remote]         # descarta híbrido/presencial detectados
      unknown_workplace: keep           # nestes sites, "não informado" = remoto
      workplace_from_description: true
      location_mode: regions
      accepted_regions: [US, CA, AU, GLOBAL]
      accept_apac_as_au: true           # "APAC" inclui Austrália
      allow_unknown_location: true      # vaga sem localização passa (marcada)

# =============================================================================
# FONTES (definidas uma vez; os perfis acima dizem qual usa qual)
# =============================================================================
sources:
  # ---------------- Brasil ----------------
  # Gupy: principal ATS do Brasil. A API pública do portal informa cidade,
  # estado e modalidade (workplaceType), então a modalidade é confiável.
  gupy:
    enabled: true
    page_size: 50
    max_pages: 4                    # por termo de busca
    queries:
      - devops
      - sre
      - cloud
      - infraestrutura
      - "analista de infra"
      - redes
      - linux
      - "suporte de ti"
      - "suporte técnico"
      - "segurança da informação"
      - cibersegurança
      - soc
      - "analista de segurança"
    # Parâmetros extras repassados à API (ex.: {state: RJ}). Deixe vazio: a
    # filtragem por cidade é feita aqui, e um parâmetro errado pode zerar a busca.
    extra_params: {}

  # Repositórios de vagas no GitHub (issues). O backend-br/vagas usa labels
  # como "Híbrido", "Júnior" e "Estagiário". Sem token, a API do GitHub
  # permite 60 requisições/hora; com GITHUB_TOKEN no .env, 5000.
  github_issues:
    enabled: true
    repos: [backend-br/vagas]
    max_pages: 3                    # 100 issues por página

  # LinkedIn (busca pública de visitante). DESLIGADO por padrão: os Termos do
  # LinkedIn proíbem coleta automatizada e o site responde HTTP 429 depois de
  # poucas consultas. O filtro de modalidade da busca nem sempre acerta, então
  # as vagas vêm com aviso "confira na vaga".
  linkedin:
    enabled: false
    keywords: ["devops", "segurança da informação", "analista de infraestrutura",
               "cloud", "soc analista", "suporte de ti"]
    locations: ["Rio de Janeiro, Rio de Janeiro, Brasil"]
    workplace: [3]                  # 1 presencial, 2 remoto, 3 híbrido
    experience_levels: [2, 3]       # 2 = Assistente, 3 = Júnior (rótulos do LinkedIn em PT)
    max_pages: 1
    min_delay_seconds: 6

  # ---------------- Exterior (remotas) ----------------
  himalayas:
    enabled: true
    seniority: Entry-level          # filtro do próprio Himalayas
    max_pages: 3
    queries: [devops, "site reliability", "platform engineer", security,
              "soc analyst", cybersecurity, cloud, "system administrator",
              infrastructure, "it support"]

  jobicy:
    enabled: true
    industries: [admin, cybersecurity, technical-support]   # admin = DevOps & Infra
    count: 100
    max_pages: 3

  remotive:
    enabled: true
    categories: [devops]
    searches: [junior, "entry level", security]
    # O Remotive pede poucas chamadas por dia: o cache acima já ajuda.

  remoteok:
    enabled: true
    tags: [devops, sysadmin, security, infosec, cloud]

  weworkremotely:
    enabled: true
    feeds:
      - https://weworkremotely.com/categories/remote-devops-sysadmin-jobs.rss
      - https://weworkremotely.com/remote-jobs.rss

# =============================================================================
# FILTROS COMUNS (área e senioridade, em português e inglês). Cada perfil
# pode sobrescrever qualquer chave na sua seção `filters`.
# =============================================================================
filters:
  # Ignora vagas mais antigas que N dias (0 = sem limite).
  max_age_days: 30

  # ---- Áreas (whitelist, aplicada ao TÍTULO). A primeira que casar vence. ----
  areas:
    security:
      - security
      - cyber ?security
      - cyber
      - secops
      - sec ops
      - devsecops
      - appsec
      - application security
      - soc
      - infosec
      - information security
      - seguranca
      - ciberseguranca
      - seguranca (?:da informacao|cibernetica|de redes|ofensiva|defensiva)
      - iam
      - gestao de (?:acessos|identidades|vulnerabilidades)
      - identity (?:and|&) access
      - vulnerabilit\w*
      - vulnerabilidades?
      - penetration test\w*
      - pentest\w*
      - threat
      - resposta a incidentes
      - incident response
      - detection engineer\w*
      - grc
    devops_sre_platform:
      - devops
      - dev ops
      - sre
      - site reliability
      - confiabilidade
      - platform engineer\w*
      - platform ops
      - engenheir[oa] de plataforma
      - kubernetes
      - k8s
      - ci ?/ ?cd
      - observabilidade
      - observability
      - release engineer
      - build engineer
    infra_cloud_sysadmin:
      - infraestrutura
      - infra
      - infrastructure
      - cloud
      - nuvem
      - sysadmin
      - sys admin
      - administrador de (?:sistemas|redes|servidores)
      - systems? admin\w*
      - systems? engineer
      - linux
      - windows server
      - windows (?:server )?admin\w*
      - redes
      - network\w*
      - telecom\w*
      - datacenter
      - data ?cent(?:er|re)
      - noc
      - virtualizacao
      - virtuali[sz]ation
      - suporte de ti
      - suporte tecnico
      - suporte de infraestrutura
      - analista de suporte
      - tecnico de (?:ti|informatica|suporte|redes)
      - it support
      - it operations
      - it ops
      - it technician
      - desktop support
      # Descomente se quiser incluir atendimento de primeiro nível:
      # - help ?desk
      # - service ?desk

  # Títulos que casam com uma área mas não são da área.
  title_area_exclusions:
    - seguranca do trabalho
    - seguranca patrimonial
    - seguranca eletronica
    - seguranca empresarial
    - seguranca privada
    - vigilante
    - tecnico de seguranca
    - redes sociais
    - social media
    - infraestrutura (?:civil|predial|urbana|de obras)
    - obras
    - engenheir[oa] civil
    - eletricista
    - manutencao predial
    - comercial
    - vendas
    - sales
    - marketing
    - recrutamento
    - recruit\w*
    - talent acquisition
    - account (?:executive|manager)
    - atendimento ao cliente
    - customer success
    - business development
    - designer
    - product (?:manager|owner)
    - copywriter
    - accountant
    - juridico
    - contab\w*
    - solutions? consultant

  # ---- Senioridade ----
  # Marcadores que tornam a vaga "explicitamente júnior" (procurados no TÍTULO).
  junior_markers:
    - junior
    - jr\.?
    - entry[- ]?level
    - associate
    - assistente
    - nivel (?:1|i)
    - n1
    - tier ?(?:1|i)
    - level ?(?:1|i)
    - l1
    - early[- ]career
    - new[- ]grad\w*
    - graduate
  # Também aceita "Analista de Infraestrutura I", "Engineer I" (romano I) no título.
  accept_roman_one: true
  # true  = só entra vaga com marcador júnior explícito (regra rígida).
  # false = vagas SEM nível no título também entram, com aviso. No Brasil
  #         muitas vagas júnior vêm só como "Analista de Infraestrutura".
  require_junior_marker: true

  # BLACKLIST: qualquer termo destes no TÍTULO descarta a vaga imediatamente.
  seniority_blacklist:
    # estágio / trainee / aprendiz
    - estagi\w*
    - intern
    - interns
    - internship
    - trainee
    - aprendiz
    - jovem aprendiz
    - apprentice\w*
    - co-?op
    # pleno / intermediário
    - pleno
    - pl(?!/)
    - mid
    - mid[- ]?level
    - mid[- ]?senior
    - midweight
    - intermediate
    - ii
    - iii
    - iv
    - nivel (?:2|3|ii|iii)
    - n2
    - n3
    - tier ?(?:2|3|ii|iii)
    - level ?(?:2|3|ii|iii)
    - l2
    - l3
    - (?:engineer|analyst|administrator|developer|specialist) (?:2|3|4)
    # sênior e acima
    - senior
    - sr\.?
    - snr
    - especialista
    - specialist
    - lead
    - leader
    - lider
    - tech lead
    - principal
    - staff
    - coordenador\w*
    - supervisor\w*
    - gerente
    - manager
    - head
    - diretor\w*
    - director
    - vp
    - vice president
    - chief
    - cto
    - ciso
    - arquitet\w*
    - architect
    - expert
    - experienced

  # Descrição: "smart" descarta por frases que descrevem o nível da vaga e por
  # anos de experiência; "strict" descarta por qualquer termo da blacklist.
  description_mode: smart
  # Descarta se a vaga exigir MAIS que isto de experiência (anos mínimos).
  max_years_experience: 2
  description_reject_phrases:
    - vaga (?:de |para )?(?:pleno|senior|especialista)
    - nivel (?:pleno|senior|especialista)
    - programa de (?:estagio|trainee)
    - vaga de estagio
    - internship
    - intern (?:position|role|program\w*)
    - summer intern\w*
    - trainee program\w*
    - this is an? (?:paid |unpaid )?intern\w*
    - this is an? (?:senior|mid[- ]level|lead|principal|staff)\b
    - (?:senior|mid)[- ]level (?:role|position|opportunity|engineer|candidate)
    - (?:seeking|looking for|hiring) an? (?:experienced|seasoned|senior)
  junior_marker_in_description: false
  # Usa o nível informado pela fonte (Himalayas "Entry-level", labels do
  # GitHub, tipo de vaga do Gupy). Pleno/Sênior/Estágio da fonte sempre descartam.
  trust_source_seniority: true

# =============================================================================
# Relatório HTML
# =============================================================================
report:
  title: Vagas júnior em Segurança, DevOps e Infra
  scope: Híbridas no Rio de Janeiro e região, e 100% remotas em EUA, Canadá, Austrália e globais.
  footer: >-
    Cada link abre a vaga na fonte original. Vagas com aviso amarelo têm algo a conferir
    (modalidade, cidade ou nível). Vagas remotas restritas a EUA, Canadá ou Austrália
    costumam exigir autorização de trabalho no país; as marcadas como Global tendem a ser
    as mais viáveis a partir do Brasil.

# =============================================================================
# Notificações (credenciais vêm do arquivo .env)
# =============================================================================
notifications:
  discord: false
  telegram: false
  notion: false
  max_per_run: 25                  # evita spam na primeira execução
